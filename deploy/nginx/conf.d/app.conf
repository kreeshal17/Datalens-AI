# Phase 1: plain HTTP. This is what's live before you've obtained a TLS
# certificate. It proxies everything to the Django backend and serves the
# ACME HTTP-01 challenge certbot needs to issue that certificate.
#
# Once you have a certificate (see the deploy guide), replace this file's
# contents with deploy/nginx/conf.d/app-ssl.conf.example (filled in with
# your real hostname) and `docker compose restart nginx`.

server {
    listen 80;
    server_name _;

    client_max_body_size 25M;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/media/;
    }

    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
